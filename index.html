<!doctype html><html lang="en"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>LUMEN | Germany Decision Cockpit</title>  <style>    :root { --ink:#102218; --muted:#617064; --paper:#f5f5ee; --card:#fff; --lime:#d8f56a; --green:#17724c; --orange:#fa9562; --line:#dce2d9; }    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }    header { background:var(--ink); color:#fff; padding:46px max(22px,calc((100vw - 1160px)/2)); } header p { max-width:720px; color:#cfdbd1; margin:8px 0 0; } h1 { font-size:clamp(30px,5vw,52px); line-height:1; margin:0; letter-spacing:-.045em; } h2 { font-size:20px; margin:0 0 14px; letter-spacing:-.025em; } main { max-width:1160px; margin:0 auto; padding:28px 22px 54px; }.notice { margin-bottom:22px; padding:14px 16px; border-left:4px solid var(--orange); background:#fff4ed; }    .layout { display:grid; grid-template-columns:360px 1fr; gap:20px; }.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 4px 18px #173a2009; }.controls { position:sticky; top:16px; align-self:start; }.field { margin:0 0 18px; }.field label { display:flex; justify-content:space-between; font-weight:650; margin-bottom:7px; }.field small { display:block; color:var(--muted); margin-top:5px; }.value { color:var(--green); }.seg { display:flex; gap:6px; flex-wrap:wrap; }.seg button { cursor:pointer; border:1px solid var(--line); border-radius:99px; padding:8px 11px; color:var(--ink); background:#fff; font-weight:600; }.seg button.active { background:var(--lime); border-color:#9db642; } input[type=range] { width:100%; accent-color:var(--green); } select { width:100%; padding:10px; font:inherit; border:1px solid var(--line); border-radius:8px; background:#fff; }    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }.metric { padding:16px; border-radius:12px; background:#eef4ec; }.metric strong { display:block; font-size:26px; letter-spacing:-.04em; }.metric span { font-size:12px; color:var(--muted); }.metric.accent { background:var(--lime); }.metric.warn { background:#fff0e8; }.grid { display:grid; grid-template-columns:1.15fr .85fr; gap:20px; margin-top:20px; }.bar-row { display:grid; grid-template-columns:120px 1fr 72px; gap:10px; align-items:center; margin:12px 0; }.bar { height:13px; background:#e7ede5; overflow:hidden; border-radius:99px; }.fill { height:100%; background:var(--green); border-radius:99px; }.decision { padding:20px; background:var(--ink); color:#fff; border-radius:14px; }.decision .tag { display:inline-block; padding:4px 9px; border-radius:99px; background:var(--lime); color:var(--ink); font-size:12px; font-weight:700; }.decision p { color:#d1dfd4; }.data-note { color:var(--muted); font-size:13px; } table { width:100%; border-collapse:collapse; font-size:13px; } th,td { padding:9px 5px; text-align:left; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:600; } .hidden { display:none; }    @media(max-width:800px) { .layout,.grid { grid-template-columns:1fr; }.controls { position:static; }.metrics { grid-template-columns:repeat(2,1fr); } }      /* Lumon-inspired visual system: sterile, retro-corporate, quietly uncanny */    :root { --ink:#d9e3df; --muted:#82918d; --paper:#0b1113; --card:#111c1f; --lime:#b9d9ca; --green:#8fcfc2; --orange:#e7b86b; --line:#294044; --cyan:#8fcfc2; }    * { border-radius:0 !important; }    body { color:var(--ink); background:radial-gradient(circle at 50% -10%, #203538 0, #0b1113 48%); font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing:.015em; }    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.11; background:repeating-linear-gradient(0deg, transparent 0 3px, #9fd4c8 4px); mix-blend-mode:screen; }    header { background:#101b1e; border-bottom:1px solid var(--line); box-shadow:0 0 32px #79cabe16 inset; padding:34px max(22px,calc((100vw - 1160px)/2)); }    header:before { content:"LUMEN / DE-MARKET ENTRY   MODULE 04: DECISION ENGINE"; display:block; color:var(--cyan); font-size:11px; letter-spacing:.16em; margin-bottom:25px; }    header:after { content:"SESSION ACTIVE   /   CFO VIEW"; display:block; position:absolute; right:24px; top:38px; color:var(--muted); font-size:10px; letter-spacing:.12em; }    h1 { color:#edf6f0; font-family:Arial,sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:clamp(28px,5vw,50px); }    header p { color:#9dafaa; max-width:760px; }    main { position:relative; }    .notice { background:#172629; border:1px solid #3b5b5b; border-left:4px solid var(--orange); color:#d6e2dc; }    .card, .metric, .decision { border:1px solid var(--line); box-shadow:0 0 0 1px #081012, 0 8px 26px #0008; }    .card { background:linear-gradient(135deg,#142327,#101a1d); }    .controls h2, .card h2 { color:#dcebe5; font-family:Arial,sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:15px; }    .field label, th { color:#9fd2c8; text-transform:uppercase; font-size:11px; letter-spacing:.12em; }    .field small, .data-note, .metric span { color:#81938e; }    .value, .metric strong { color:var(--cyan); }    .seg button, select { color:#cfe1db; background:#172a2e; border:1px solid #426166; font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }    .seg button.active { color:#0d191a; background:var(--cyan); border-color:var(--cyan); }    input[type=range] { accent-color:var(--cyan); }    .metric { background:#162629; }
